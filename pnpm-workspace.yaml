packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
    '@better-auth/expo': ^1.7.3
    '@biomejs/biome': ^2.5.12
    '@tailwindcss/postcss': ^4.3.3
    '@tanstack/react-form': ^1.33.5
    '@tanstack/react-query': ^5.102.8
    '@tanstack/react-query-devtools': ^5.102.8
    better-auth: ^1.7.3
    tailwindcss: ^4.3.3
    typescript: ^6.0.3
    zod: ^4.5.4

catalogs:
    node22:
        '@types/node': ^24.13.3
    orpc:
        '@orpc/client': ^1.15.0
        '@orpc/openapi': ^1.15.0
        '@orpc/server': ^1.15.0
        '@orpc/tanstack-query': ^1.15.0
        '@orpc/zod': ^1.15.0
    react19:
        '@types/react': ~19.2.18
        '@types/react-dom': ~19.2.7
        react: ~19.2.8
        react-dom: ~19.2.8
    varlock:
        '@varlock/nextjs-integration': ^1.2.2
        '@varlock/vite-integration': ^1.5.1
        varlock: ^1.18.0

# Varlock replaces Next.js' env loader - https://varlock.dev/integrations/nextjs/
# Unversioned: overrides don't support `catalog:`; apps/web's direct dep pins the version.
overrides:
    '@next/env': npm:@varlock/nextjs-integration

allowBuilds:
    '@parcel/watcher': true
    esbuild: true
    lefthook: true
    msw: true
    sharp: true

minimumReleaseAge: 10080  # one week

hoist: false  # Disable hoisting to isolate dependencies per workspace
nodeLinker: isolated  # Ensure pnpm uses the default "isolated" node_modules structure
linkWorkspacePackages: true  # Auto-link workspace packages when version ranges match
engineStrict: true  # Restrict using incorrect engines
