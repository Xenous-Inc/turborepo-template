packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
    '@better-auth/expo': ^1.6.27
    '@biomejs/biome': ^2.5.8
    '@dotenvx/dotenvx': ^1.75.1
    '@t3-oss/env-core': ^0.13.11
    '@t3-oss/env-nextjs': ^0.13.11
    '@tailwindcss/postcss': ^4.3.3
    '@tanstack/react-form': ^1.33.5
    '@tanstack/react-query': ^5.101.4
    '@tanstack/react-query-devtools': ^5.101.4
    better-auth: ^1.6.27
    jiti: ^2.7.0
    tailwindcss: ^4.3.3
    typescript: ~5.8.3
    zod: ^4.4.3

catalogs:
    node22:
        '@types/node': ^24.13.3
    orpc:
        '@orpc/client': ^1.15.0
        '@orpc/openapi': ^1.15.0
        '@orpc/server': ^1.15.0
        '@orpc/tanstack-query': ^1.15.0
        '@orpc/zod': ^1.15.0
    react19:
        '@types/react': ~19.2.18
        '@types/react-dom': ~19.2.4
        react: ~19.2.8
        react-dom: ~19.2.8

allowBuilds:
    '@parcel/watcher': true
    esbuild: true
    lefthook: true
    msw: true
    sharp: true

minimumReleaseAge: 10080  # one week

hoist: false  # Disable hoisting to isolate dependencies per workspace
nodeLinker: isolated  # Ensure pnpm uses the default "isolated" node_modules structure
linkWorkspacePackages: true  # Auto-link workspace packages when version ranges match
engineStrict: true  # Restrict using incorrect engines
