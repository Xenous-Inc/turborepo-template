name: CI

on:
    # `**` matches slashes and `*` does not, so this also covers PRs into `release/1.0`.
    pull_request:
        branches: ['**']
    push:
        branches: [main, 'dev*']
    merge_group:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    # A new run cancels the one in flight, except on main and dev*, where every commit keeps
    # its own status. Manual cancelling still works anywhere.
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/dev') }}

# You can leverage Vercel Remote Caching with Turbo to speed up your builds
# @link https://turborepo.org/docs/core-concepts/remote-caching#remote-caching-on-vercel-builds
env:
    FORCE_COLOR: 3
    TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
    lint_and_format:
        name: Lint & Format
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Setup
            uses: ./tooling/github/setup

          - name: Lint & Format
            run: pnpm run ci

          - name: Check workspace
            run: pnpm run check:ws

    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Setup
            uses: ./tooling/github/setup

          - name: Typecheck
            run: pnpm run typecheck

    dependency_audit:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Setup
            uses: ./tooling/github/setup

          - name: Audit dependencies
            run: pnpm audit --prod --audit-level critical
